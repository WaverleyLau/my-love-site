name: code-review
description: 在每次代码修改时自动进行代码审查并生成审查报告
version: 1.0.0
triggers:
  - type: file_change
    patterns:
      - "**/*.ts"
      - "**/*.tsx"
      - "**/*.js"
      - "**/*.jsx"
      - "**/*.vue"
      - "**/*.css"
      - "**/*.scss"
      - "**/*.less"
    exclude:
      - "node_modules/**"
      - "dist/**"
      - ".git/**"
      - "*.min.js"
      - "*.min.css"

actions:
  - name: review-code
    type: ai_review
    config:
      review_focus:
        - code_quality
        - security
        - performance
        - maintainability
        - best_practices
      report_format: markdown
      output_location: .trae/reports/code-review-report.md

review_rules:
  code_quality:
    - 检查代码是否符合项目编码规范
    - 检查变量和函数命名是否清晰有意义
    - 检查代码复杂度是否过高
    - 检查是否有重复代码
    - 检查错误处理是否完善

  security:
    - 检查是否有潜在的安全漏洞
    - 检查用户输入是否进行了验证和转义
    - 检查敏感信息是否被硬编码
    - 检查是否有SQL注入、XSS等风险

  performance:
    - 检查是否有性能瓶颈
    - 检查是否有不必要的计算或渲染
    - 检查资源加载是否优化
    - 检查内存泄漏风险

  maintainability:
    - 检查代码是否易于理解和维护
    - 检查注释是否清晰完整
    - 检查代码结构是否合理
    - 检查是否遵循单一职责原则

  best_practices:
    - 检查是否遵循框架最佳实践
    - 检查是否使用了现代语法特性
    - 检查类型定义是否完整（TypeScript项目）
    - 检查组件设计是否合理（Vue项目）

report_template: |
  # 代码审查报告

  ## 审查概览
  - **审查时间**: {{timestamp}}
  - **审查文件**: {{file_count}} 个文件
  - **发现问题**: {{issue_count}} 个问题
  - **严重级别**: 🔴 严重 {{critical_count}} | 🟠 警告 {{warning_count}} | 🟡 建议 {{suggestion_count}}

  ## 文件变更列表
  {{changed_files}}

  ## 详细审查结果
  {{detailed_results}}

  ## 改进建议
  {{improvement_suggestions}}

  ---
  *此报告由自动代码审查工具生成*
